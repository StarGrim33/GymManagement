services:
  gymmanagement.api:
    image: ${DOCKER_REGISTRY-}gymmanagementapi
    container_name: Gym-Management-API
    build:
      context: .
      dockerfile: src/GymManagement.Api/Dockerfile
    depends_on:
      - gym-management-db
      - rabbitmq

  gym-management-db:
    image: postgres:latest
    container_name: Gym-Management.Db
    environment:
      - POSTGRES_DB=gym-management-db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - ./.containers/database:/var/lib/postgresql/data
    ports:
      - 5432:5432

  gym-management-idp:
    image: quay.io/keycloak/keycloak
    container_name: Gym-Management-Idp
    command: start-dev --import-realm
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=admin
      - KEYCLOAK_IMPORT=/tmp/bookify-realm-export.json
    volumes:
      - ./.containers/idp:/opt/keycloak/keycloak/standalone/data
      - ./.files/bookify-realm-export.json:/opt/keycloak/data/import/bookify-realm-export.json
    ports:
      - 18080:8080

  bookify-seq:
    image: datalust/seq:latest
    container_name: Gym-Management.Seq
    environment:
      - ACCEPT_EULA=Y
    ports:
      - 5341:5341
      - 8081:80

  bookify-redis:
    image: redis:latest
    container_name: Bookify.Redis
    restart: always
    ports:
      - '6379:6379'
 
  rabbitmq:
    image: rabbitmq:4.1.0-beta.5-management-alpine
    container_name: Gym-Management-RabbitMQ
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    ports:
     - "5672:5672"
     - "15672:15672"
    volumes:
      - ./rabbitmq-data:/var/lib/rabbitmq

  gymmanagement.notificationservice.api:
    image: ${DOCKER_REGISTRY-}gymmanagementnotificationserviceapi
    container_name: Gym-Management-NotificationService-API
    build:
      context: .
      dockerfile: src/GymManagement.NotificationService.Api/Dockerfile
    depends_on:
      - rabbitmq
    ports:
      - "5003:80" # Порт для доступа к Notification Service